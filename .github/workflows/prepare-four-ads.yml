name: Prepare four ad samples
on:
  push:
    branches: [video-ads-four-examples]
    paths: ['.github/workflows/prepare-four-ads.yml']
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install media tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          python -m venv "$RUNNER_TEMP/drive-tools"
          "$RUNNER_TEMP/drive-tools/bin/pip" install -q gdown==5.2.0
      - name: Download and verify the four clips
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p public/videos/fashion-ads
          ids=(1W2K0DykEy9SRCY_0KeRSFXEcHCqQCqZN 1yiQdT782-fPwIzFU7v9lWEgbQpldhZqn 1aX42a0ezpmkAFEtCA7M5C0xO_S5YUl9M 1XFFwCCTvflj8IEhqZL1JRXCYmrwhsk0k)
          for i in "${!ids[@]}"; do
            base="public/videos/fashion-ads/ad-$((i+1))"
            "$RUNNER_TEMP/drive-tools/bin/gdown" "https://drive.google.com/uc?id=${ids[$i]}" -O "$RUNNER_TEMP/source.mp4"
            ffmpeg -v error -y -i "$RUNNER_TEMP/source.mp4" -map 0:v:0 -map '0:a:0?' -vf "scale='min(960,iw)':-2" -c:v libx264 -threads 2 -crf 24 -pix_fmt yuv420p -c:a aac -b:a 96k -movflags +faststart "$base.mp4"
            ffmpeg -v error -y -i "$base.mp4" -vf "thumbnail,scale=640:-2" -frames:v 1 "$base.webp"
            test -s "$base.webp"
            ffmpeg -v error -xerror -i "$base.mp4" -f null -
            ffprobe -v error -show_entries format=duration,size -of json "$base.mp4"
          done
      - name: Save verified media on the redesign branch
        run: |
          git config user.name github-actions
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/videos/fashion-ads/
          git commit -m "Add four optimized fashion ads and their poster frames"
          git push
