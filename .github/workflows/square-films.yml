name: Export square fashion films
on:
  push:
    branches: [prepare-square-fashion-films]
    paths: ['.github/workflows/square-films.yml']
permissions:
  contents: write
jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Encode the four square films and poster frames
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          mkdir -p public/videos/fashion-ads/square
          cd public/videos/fashion-ads
          positions=(0.77 0.48 0.52 0.35)
          for i in 1 2 3 4; do
            pos=${positions[$((i-1))]}
            ffmpeg -v error -i "ad-$i.mp4" -map 0:v:0 -map '0:a:0?' -vf "crop=iw:iw:0:(ih-iw)*$pos,setsar=1" -c:v libx264 -threads 2 -crf 19 -preset medium -pix_fmt yuv420p -c:a copy -movflags +faststart "square/ad-$i.mp4"
            ffmpeg -v error -i "ad-$i.webp" -vf "crop=iw:iw:0:(ih-iw)*$pos" -frames:v 1 -quality 85 "square/ad-$i.webp"
            dims=$(ffprobe -v error -select_streams v:0 -show_entries stream=width,height -of csv=p=0 "square/ad-$i.mp4")
            test "${dims%,*}" = "${dims#*,}"
            ffmpeg -v error -xerror -i "square/ad-$i.mp4" -f null -
          done
          git add square
          git config user.name github-actions
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Export four square fashion films and matching stills"
          git push
