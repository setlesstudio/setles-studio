name: Check published fashion ad players
on:
  push:
    branches: [check-four-ad-players]
permissions: {}
jobs:
  playback:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-save playwright-core@1.55.0
      - name: Play every ad on desktop and mobile
        run: |
          node --input-type=module <<'JS'
          import { chromium } from 'playwright-core';
          import assert from 'node:assert/strict';
          const url = 'https://www.setlesstudio.com/services/realistic-ai-video-ads-ugc';
          const browser = await chromium.launch({executablePath:'/usr/bin/google-chrome', args:['--no-sandbox','--autoplay-policy=no-user-gesture-required']});
          try {
            for (const width of [390, 1366]) {
              const page = await browser.newPage({viewport:{width,height:844},isMobile:width===390,hasTouch:width===390});
              for(let attempt=0;attempt<48;attempt++){
                await page.goto('https://www.setlesstudio.com/?verify=glass-'+attempt,{waitUntil:'domcontentloaded'});
                if(await page.locator('form[aria-labelledby="project-brief-heading"]').count()) break;
                await page.waitForTimeout(5000);
              }
              const form=page.locator('form[aria-labelledby="project-brief-heading"]');
              assert.equal(await form.count(),1);
              assert(await form.evaluate(el=>el.getBoundingClientRect().right<=innerWidth && getComputedStyle(el).backdropFilter.includes('blur')));
              const hero=page.locator('section').filter({has:form}).first();
              assert(!(await hero.innerText()).includes('We create realistic'));
              const compare=page.locator('section').filter({has:page.getByRole('heading',{name:'From product photo to campaign ready content'})}).first();
              const group=compare.locator('div.grid').first();
              const box=await group.boundingBox();
              assert(box.width<=1161 && box.width<width*.92);
              assert.equal(await group.locator('img').count(),3);
              let requests=0;
              await page.route('**/api/contact',async route=>{
                requests++;
                const data=route.request().postDataJSON();
                assert.equal(data.message,'Test launch');
                assert.equal(data.service,'Homepage project brief');
                await route.fulfill({status:requests===1?500:200,json:requests===1?{error:'Test error'}:{success:true}});
              });
              await form.getByRole('button').click();
              assert.equal(requests,0);
              await form.getByLabel('Name',{exact:true}).fill('Test');
              await form.getByLabel('Email',{exact:true}).fill('test@example.com');
              await form.getByLabel('What are you launching?').fill('Test launch');
              await form.getByRole('button').click();
              await form.getByText(/couldn’t be sent/).waitFor();
              await form.getByRole('button').click();
              await form.getByText(/Your brief has been sent/).waitFor();
              assert.equal(requests,2);
              await page.close();
            }
          } finally {await browser.close();}
          JS
