name: Check published fashion ad players
on:
  push:
    branches: [check-four-ad-players]
permissions: {}
jobs:
  playback:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-save playwright-core@1.55.0
      - name: Play every ad on desktop and mobile
        run: |
          node --input-type=module <<'JS'
          import { chromium } from 'playwright-core';
          import assert from 'node:assert/strict';
          const url = 'https://www.setlesstudio.com/services/realistic-ai-video-ads-ugc';
          const browser = await chromium.launch({executablePath:'/usr/bin/google-chrome', args:['--no-sandbox','--autoplay-policy=no-user-gesture-required']});
          try {
            for (const width of [390, 1366]) {
              const page = await browser.newPage({viewport:{width,height:844},isMobile:width===390,hasTouch:width===390});
              let mediaRequests = 0;
              page.on('request', r=>{if(r.url().includes('/videos/fashion-ads/') && r.url().includes('.mp4')) mediaRequests++;});
              for(let attempt=0; attempt<48; attempt++){
                await page.goto(url+'?verify=full-portrait-'+attempt,{waitUntil:'domcontentloaded'});
                if(await page.locator('#video-examples img[src="/videos/fashion-ads/ad-1.webp"]').count()===1) break;
                await page.waitForTimeout(5000);
              }
              const cards=page.locator('#video-examples figure');
              assert.equal(await cards.count(),4);
              assert.equal(mediaRequests,0);
              const hero=page.locator('section').filter({has:page.locator('h1')}).first();
              assert.equal(await hero.locator('img,video,picture').count(),0);
              assert.equal(await hero.evaluate(e=>getComputedStyle(e).backgroundColor),'rgb(242, 106, 27)');
              const products=page.locator('section').filter({has:page.getByRole('heading',{name:'Choose your video format.'})}).locator('article');
              assert.equal(await products.count(),6);
              const filmTops=await cards.evaluateAll(els=>new Set(els.map(e=>Math.round(e.getBoundingClientRect().top))).size);
              assert.equal(filmTops,1);
              const cardRows=await products.evaluateAll(els=>new Set(els.map(e=>Math.round(e.getBoundingClientRect().top))).size);
              assert.equal(cardRows,width===390?3:1);
              assert(await products.evaluateAll(els=>els.every(e=>getComputedStyle(e).backgroundColor==='rgb(255, 255, 255)')));
              assert.equal(await page.locator('h1').count(),1);
              assert((await page.title()).includes('AI Fashion Ads and UGC Videos'));
              const questions=page.locator('details').filter({has:page.locator('summary')});
              assert.equal(await page.locator('section:has(h2:text("ad FAQs.")) details').count(),9);
              const faq=page.locator('summary').filter({hasText:'Where is SetlesStudio based'});
              await faq.click();
              assert(await page.getByText('SetlesStudio is based in Lahore, Pakistan.',{exact:false}).first().isVisible());
              assert(await page.evaluate(()=>document.documentElement.scrollWidth<=window.innerWidth));
              const schema=await page.locator('script[type="application/ld+json"]').allTextContents();
              assert(schema.some(x=>JSON.parse(x)['@type']==='FAQPage' && JSON.parse(x).mainEntity.length===9));
              for(let i=0;i<4;i++){
                const card=cards.nth(i);
                await card.scrollIntoViewIfNeeded();
                await card.locator('img').evaluate(img=>img.decode());
                assert(await card.locator('img').evaluate(img=>img.naturalHeight>img.naturalWidth && getComputedStyle(img).objectFit==='contain'));
                await card.getByRole('button').click();
                await page.waitForFunction(()=>{const v=document.querySelector('#video-examples video');return v && v.currentTime>0.1 && v.videoWidth>0;},null,{timeout:20000});
                assert.equal(await page.locator('#video-examples video').count(),1);
                assert(await card.locator('video').evaluate(v=>v.videoHeight>v.videoWidth && Math.abs(v.clientWidth/v.clientHeight-v.videoWidth/v.videoHeight)<0.01 && getComputedStyle(v).objectFit==='contain' && !v.currentSrc.includes('/square/')));
                console.log(width,i+1,await card.locator('video').evaluate(v=>[v.currentSrc,v.videoWidth,v.videoHeight,v.duration]));
              }
              for(const name of ['Get a video quote','Send my product photo']) assert.match(await page.getByRole('link',{name,exact:true}).getAttribute('href'),/^https:\/\/wa\.me\/923017281412/);
              const title='AI Fashion Ads and UGC Videos';
              const sample='Play '+title+' sample';
              for(let attempt=0;attempt<48;attempt++){
                await page.goto('https://www.setlesstudio.com/?verify=listing-'+attempt,{waitUntil:'domcontentloaded'});
                if(await page.getByRole('button',{name:sample}).count()) break;
                await page.waitForTimeout(5000);
              }
              const tile=page.locator('article').filter({has:page.getByRole('heading',{name:title,exact:true})});
              assert.equal(await tile.count(),1);
              assert.equal(await tile.locator('video').count(),0);
              await tile.getByRole('button',{name:sample}).click();
              await page.waitForFunction(()=>{const v=document.querySelector('article video');return v && v.currentTime>0.1 && v.videoHeight>v.videoWidth;});
              assert((await tile.locator('video').getAttribute('src')).endsWith('/ad-1.mp4'));
              await tile.getByRole('link',{name:title}).click();
              await page.waitForURL('**/services/realistic-ai-video-ads-ugc');
              for(const route of ['/services','/portfolio','/pricing']){
                await page.goto('https://www.setlesstudio.com'+route,{waitUntil:'domcontentloaded'});
                assert(await page.locator('main').getByText(title,{exact:true}).count()>0,route);
              }
              await page.close();
            }
          } finally {await browser.close();}
          JS
